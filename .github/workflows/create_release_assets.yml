name: Create Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and release (for example v6.0.2)
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  create_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Check version and prepare release notes
        shell: bash
        run: |
          version=$(sed -n 's/^#define VERSION[[:space:]]*"\([^"]*\)".*/\1/p' include/config.h)
          header=$(grep -m 1 . changeNew.md | sed 's/^# //')
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ "$version" != "$RELEASE_TAG" ]] || [[ "$header" != "$RELEASE_TAG" ]]; then
            echo "Version mismatch: tag=$RELEASE_TAG config=$version release-notes=$header"
            exit 1
          fi
          tail -n +2 changeNew.md > "$RUNNER_TEMP/release_notes.md"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/requirements-build.txt

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-pio-py313-${{ hashFiles('platformio.ini', '.github/requirements-build.txt') }}
          restore-keys: |
            ${{ runner.os }}-pio-py313-

      - name: Install PlatformIO
        run: python -m pip install -r .github/requirements-build.txt

      - name: Run host checks
        run: python -B -m unittest discover -s tests

      - name: Build release from source
        run: pio run -e esp32

      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          flash="release/buderus_km271_esp32_flash_${RELEASE_TAG}.bin"
          ota="release/buderus_km271_ota_update_${RELEASE_TAG}.bin"
          debug="release/buderus_km271_debug_${RELEASE_TAG}.zip"
          test -s "$debug"
          test -s "$flash"
          test -s "$ota"
          gh release create "$RELEASE_TAG" "$flash" "$ota" "$debug" \
            --verify-tag \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release_notes.md"

      - name: Clean generated files
        if: always()
        run: rm -rf release web/output
