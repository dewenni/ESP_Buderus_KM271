<!DOCTYPE html>
<html>
  <head>
    <title>ESP Async Web Server</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="../css/pico.css" />
    <link rel="stylesheet" type="text/css" href="../css/custom.css" />
    <link rel="stylesheet" type="text/css" href="../css/icons.css" />
    <script src="../js/main.js" defer></script>
    <script src="../js/lang.js" defer></script>
    <style></style>
    <script>
      function test() {
        document.getElementById("tab8").classList.add("active");
      }
      setInterval(test, 1000);
    </script>
  </head>
  <body>
    <!-- Layout -->
    <header
      style="
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
      "></header>
    <!-- Tab-Content -->
    <main class="container">
      <!--SECTION-START-->
      <div id="tab8" class="tab-content information-page">
        <header class="page-heading">
          <h1 data-i18n="alarm"></h1><p data-i18n="info_alarm_subtitle"></p>
        </header>
        <div id="p08_alarm_content" aria-live="polite" aria-atomic="true"></div>
        <p class="information-note" data-i18n="alarm_scope"></p>
        <details class="alarm-originals">
          <summary data-i18n="alarm_originals"></summary>
          <table class="alarm-raw"><tbody>
            <tr><th scope="row" data-i18n="message++ 1"></th><td id="p08_err_msg1"></td></tr>
            <tr><th scope="row" data-i18n="message++ 2"></th><td id="p08_err_msg2"></td></tr>
            <tr><th scope="row" data-i18n="message++ 3"></th><td id="p08_err_msg3"></td></tr>
            <tr><th scope="row" data-i18n="message++ 4"></th><td id="p08_err_msg4"></td></tr>
          </tbody></table>
        </details>
      </div>
      <!--SECTION-END-->
    </main>
    <!-- Footer -->
    <footer
      style="
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
      ">
      <div id="status">STATUS</div>
    </footer>
  </body>
</html>
