<!DOCTYPE html>
<html>
  <head>
    <title>ESP Async Web Server</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="../css/pico.css" />
    <link rel="stylesheet" type="text/css" href="../css/custom.css" />
    <link rel="stylesheet" type="text/css" href="../css/icons.css" />
    <script src="../js/fun.js" defer></script>
    <script src="../js/doc.js" defer></script>
    <script src="../js/lang.js" defer></script>
    <style></style>
    <script>
      function test() {
        document.getElementById("tab10").classList.add("active");
        localizePage("de");
      }
      setInterval(test, 1000);
    </script>
  </head>
  <body>
    <!-- Layout -->
    <header
      style="
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
      "></header>
    <!-- Tab-Content -->
    <main class="container">
      <!--SECTION-START-->
      <!-- Logger-Inhalt hier -->
      <div id="tab10" class="tab-content information-page">
        <header class="page-heading log-heading">
          <div><h1 data-i18n="logger"></h1><p data-i18n="info_log_subtitle"></p></div>
          <label class="log-recording"><span data-i18n="info_log_recording"></span><input name="log_enable" type="checkbox" role="switch" id="cfg_logger_enable" /></label>
        </header>
<div class="log-toolbar">
<div><label for="p10_logger_type" data-i18n="info_log_source"></label><select
                id="p10_logger_type"
                onchange="changeLogType(this)">
                <option value="0" data-i18n="log_type_1"></option>
                <option value="1" data-i18n="log_type_2"></option>
              </select>
</div>
<div id="log_level_field"><label for="cfg_logger_level" data-i18n="info_log_level"></label><select
                id="cfg_logger_level">
                <option value="1" data-i18n="log_level_1"></option>
                <option value="2" data-i18n="log_level_2"></option>
                <option value="3" data-i18n="log_level_3"></option>
                <option value="4" data-i18n="log_level_4"></option>
              </select>
</div>
<div id="log_filter_field"><label for="cfg_logger_filter" data-i18n="filter"></label><select
                id="cfg_logger_filter">
                <option value="0" data-i18n="log_mode_1"></option>
                <option value="1" data-i18n="log_mode_2"></option>
                <option value="2" data-i18n="log_mode_3"></option>
                <option value="3" data-i18n="log_mode_4"></option>
                <option value="4" data-i18n="log_mode_5"></option>
              </select>
</div>
<div><label for="cfg_logger_order" data-i18n="info_log_order"></label><select
                id="cfg_logger_order">
                <option value="0" data-i18n="sort_down"></option>
                <option value="1" data-i18n="sort_up"></option>
              </select>
</div>
<div class="tools-actions"><button id="p10_log_refresh_btn" data-i18n="refresh"></button><button id="p10_log_clr_btn" data-i18n="clear"></button>
</div>
</div>
<article class="card log-panel">
<div id="p10_log_output" role="log">
</div>
</article>
</div>
      <!--SECTION-END-->
    </main>
    <!-- Footer -->
    <footer
      style="
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
      ">
      <div id="status">STATUS</div>
    </footer>
  </body>
</html>
