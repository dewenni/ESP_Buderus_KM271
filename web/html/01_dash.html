<!DOCTYPE html>
<html>
  <head>
    <title>ESP Async Web Server</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="../css/pico.css" />
    <link rel="stylesheet" type="text/css" href="../css/custom.css" />
    <link rel="stylesheet" type="text/css" href="../css/icons.css" />
    <script src="../js/main.js" defer></script>
    <script src="../js/lang.js" defer></script>
    <style></style>
    <script>
      function test() {
        document.getElementById("tab1").classList.add("active");
      }
      setInterval(test, 1000);
    </script>
  </head>
  <body>
    <!-- Layout -->
    <header
      style="
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
      "></header>
    <!-- Tab-Content -->
    <main class="container">
      <!--SECTION-START-->
      <!-- Tab-1 -->
      <div id="tab1" class="tab-content active">
        <header class="page-heading">
          <h1 data-i18n="dashboard"></h1>
          <p data-i18n="dashboard_subtitle"></p>
        </header>
        <div class="dashboard-status">
          <article class="dash OPT_HC1">
            <div class="dash-main">
              <div class="dash-header" data-i18n="hc1$-$opmode"></div>
              <div class="dash-content">
                <div class="value" id="p01_hc1_opmode"></div>
              </div>
            </div>
            <div class="dash-icon">
              <i id="p01_hc1_opmode_icon"></i>
            </div>
          </article>

          <article class="dash OPT_HC2">
            <div class="dash-main">
              <div class="dash-header" data-i18n="hc2$-$opmode"></div>
              <div class="dash-content">
                <div class="value" id="p01_hc2_opmode"></div>
              </div>
            </div>
            <div class="dash-icon">
              <i id="p01_hc2_opmode_icon"></i>
            </div>
          </article>

          <article class="dash OPT_HC1">
            <div class="dash-main">
              <div class="dash-header" data-i18n="hc1$-$prg"></div>
              <div class="dash-content">
                <div class="value" id="p01_hc1_program"></div>
              </div>
            </div>
            <div class="dash-icon"><i class="svg i_table" aria-hidden="true"></i></div>
          </article>

          <article class="dash OPT_HC2">
            <div class="dash-main">
              <div class="dash-header" data-i18n="hc2$-$prg"></div>
              <div class="dash-content">
                <div class="value" id="p01_hc2_program"></div>
              </div>
            </div>
            <div class="dash-icon"><i class="svg i_table" aria-hidden="true"></i></div>
          </article>

          <article class="dash OPT_HW">
            <div class="dash-main">
              <div class="dash-header" data-i18n="hot_water$-$opmode"></div>
              <div class="dash-content">
                <div class="value" id="p01_ww_opmode"></div>
              </div>
            </div>
            <div class="dash-icon">
              <i id="p01_ww_opmode_icon"></i>
            </div>
          </article>

          <article class="dash OPT_SOLAR">
            <div class="dash-main">
              <div class="dash-header" data-i18n="solar$-$opmode"></div>
              <div class="dash-content">
                <div class="value" id="p01_solar_opmode"></div>
              </div>
            </div>
            <div class="dash-icon">
              <i id="p01_solar_opmode_icon"></i>
            </div>
          </article>

          <article class="dash OPT_HC1">
            <div class="dash-main">
              <div class="dash-header" data-i18n="hc1$-$day_night"></div>
              <div class="dash-content">
                <div class="value" id="p01_hc1_day_night"></div>
              </div>
            </div>
            <div class="dash-icon">
              <i id="p01_hc1_day_night_icon" class=""></i>
            </div>
          </article>

          <article class="dash OPT_HC2">
            <div class="dash-main">
              <div class="dash-header" data-i18n="hc2$-$day_night"></div>
              <div class="dash-content">
                <div class="value" id="p01_hc2_day_night"></div>
              </div>
            </div>
            <div class="dash-icon">
              <i id="p01_hc2_day_night_icon"></i>
            </div>
          </article>

          <article class="dash OPT_HC1">
            <div class="dash-main">
              <div class="dash-header" data-i18n="hc1$-$summer_winter"></div>
              <div class="dash-content">
                <div class="value" id="p01_hc1_summer_winter"></div>
              </div>
            </div>
            <div class="dash-icon">
              <i id="p01_hc1_summer_winter_icon"></i>
            </div>
          </article>

          <article class="dash OPT_HC2">
            <div class="dash-main">
              <div class="dash-header" data-i18n="hc2$-$summer_winter"></div>
              <div class="dash-content">
                <div class="value" id="p01_hc2_summer_winter"></div>
              </div>
            </div>
            <div class="dash-icon">
              <i id="p01_hc2_summer_winter_icon"></i>
            </div>
          </article>

          <article data-active-value="p03_hc1_pump" class="dash OPT_HC1">
            <div class="dash-main">
              <div class="dash-header" data-i18n="hc1$-$pump"></div>
              <div class="dash-content">
                <div class="value" id="p01_hc1_pump"></div>
              </div>
            </div>
            <div class="dash-icon">
              <i class="svg i_pump"></i>
            </div>
          </article>

          <article data-active-value="p04_hc2_pump" class="dash OPT_HC2">
            <div class="dash-main">
              <div class="dash-header" data-i18n="hc2$-$pump"></div>
              <div class="dash-content">
                <div class="value" id="p01_hc2_pump"></div>
              </div>
            </div>
            <div class="dash-icon">
              <i class="svg i_pump"></i>
            </div>
          </article>

          <article data-active-value="p01_chart_burner" class="dash">
            <div class="dash-main">
              <div class="dash-header" data-i18n="burner"></div>
              <div class="dash-content">
                <div class="value" id="p01_burner"></div>
              </div>
            </div>
            <div class="dash-icon">
              <i class="svg i_flame"></i>
            </div>
          </article>

          <article class="dash OPT_HW_OIL">
            <div class="dash-main">
              <div class="dash-header" data-i18n="oilmeter"></div>
              <div class="dash-content">
                <div class="value" id="p01_hw_oilmeter"></div>
              </div>
            </div>
            <div class="dash-icon">
              <i class="svg i_oil"></i>
            </div>
          </article>

          <article class="dash OPT_V_OIL">
            <div class="dash-main">
              <div class="dash-header" data-i18n="oilmeter"></div>
              <div class="dash-content">
                <div class="value" id="p01_v_oilmeter"></div>
              </div>
            </div>
            <div class="dash-icon">
              <i class="svg i_oil"></i>
            </div>
          </article>
          <article class="dash OPT_SENS1">
            <div class="dash-main">
              <div class="dash-header" id="p01_sens1_name"></div>
              <div class="dash-content">
                <div class="value" id="p01_sens1_value"></div>
              </div>
              <div class="dash-footer">
                <div id="p01_sens1_description"></div>
              </div>
            </div>
            <div class="dash-icon">
              <i class="svg i_temp"></i>
            </div>
          </article>

          <article class="dash OPT_SENS2">
            <div class="dash-main">
              <div class="dash-header" id="p01_sens2_name"></div>
              <div class="dash-content">
                <div class="value" id="p01_sens2_value"></div>
              </div>
              <div class="dash-footer">
                <div id="p01_sens2_description"></div>
              </div>
            </div>
            <div class="dash-icon">
              <i class="svg i_temp"></i>
            </div>
          </article>
        </div>
        <!-- END Grid1 -->
        <span id="p01_chart_valid" hidden></span>
        <span id="p01_chart_burner" hidden></span>
        <span id="p01_chart_priority" hidden></span>

        <div class="dashboard-trends">
          <!-- START Grid2 -->

          <article data-chart="p01_burner_temp_set,p01_burner_temp_act" data-chart-bit="0" data-chart-state="burner" class="dash dash-history">
            <div class="dash-header" data-i18n="burner_temp"></div>
            <div class="dash-readings">
              <div class="dash-reading dash-reading-primary dash-series-second">
                <div class="dash-reading-label" data-i18n="chart_actual"></div>
                <div class="dash-reading-value"><span id="p01_burner_temp_act" class="value"></span><span class="dash-reading-unit">°C</span></div>
              </div>
              <div class="dash-reading dash-reading-secondary dash-series-first">
                <div class="dash-reading-label" data-i18n="chart_target"></div>
                <div class="dash-reading-value"><span id="p01_burner_temp_set" class="value"></span><span class="dash-reading-unit">°C</span></div>
              </div>
            </div>
            <div class="dash-history-plot"><div class="dash-chart"></div></div>
            <div class="dash-chart-status"></div>
          </article>

          <article data-chart="p01_ww_temp_set,p01_ww_temp_act" data-chart-bit="1" data-chart-state="priority" class="dash dash-history OPT_HW">
            <div class="dash-header" data-i18n="hot_water"></div>
            <div class="dash-readings">
              <div class="dash-reading dash-reading-primary dash-series-second">
                <div class="dash-reading-label" data-i18n="chart_actual"></div>
                <div class="dash-reading-value"><span id="p01_ww_temp_act" class="value"></span><span class="dash-reading-unit">°C</span></div>
              </div>
              <div class="dash-reading dash-reading-secondary dash-series-first">
                <div class="dash-reading-label" data-i18n="chart_target"></div>
                <div class="dash-reading-value"><span id="p01_ww_temp_set" class="value"></span><span class="dash-reading-unit">°C</span></div>
              </div>
            </div>
            <div class="dash-history-plot"><div class="dash-chart"></div></div>
            <div class="dash-chart-status"></div>
          </article>

          <article data-chart="p01_solar_ww,p01_solar_collector" data-chart-bit="2" class="dash dash-history OPT_SOLAR">
            <div class="dash-header" data-i18n="solar"></div>
            <div class="dash-readings">
              <div class="dash-reading dash-reading-primary dash-series-second">
                <div class="dash-reading-label" data-i18n="collector"></div>
                <div class="dash-reading-value"><span id="p01_solar_collector" class="value"></span><span class="dash-reading-unit">°C</span></div>
              </div>
              <div class="dash-reading dash-reading-secondary dash-series-first">
                <div class="dash-reading-label" data-i18n="hot_water"></div>
                <div class="dash-reading-value"><span id="p01_solar_ww" class="value"></span><span class="dash-reading-unit">°C</span></div>
              </div>
            </div>
            <div class="dash-history-plot"><div class="dash-chart"></div></div>
            <div class="dash-chart-status"></div>
          </article>

          <article data-chart="p01_hc1_flow_set,p01_hc1_flow_act" data-chart-bit="3" data-chart-state="burner" class="dash dash-history OPT_HC1">
            <div class="dash-header" data-i18n="hc1$-$flow"></div>
            <div class="dash-readings">
              <div class="dash-reading dash-reading-primary dash-series-second">
                <div class="dash-reading-label" data-i18n="chart_actual"></div>
                <div class="dash-reading-value"><span id="p01_hc1_flow_act" class="value"></span><span class="dash-reading-unit">°C</span></div>
              </div>
              <div class="dash-reading dash-reading-secondary dash-series-first">
                <div class="dash-reading-label" data-i18n="chart_target"></div>
                <div class="dash-reading-value"><span id="p01_hc1_flow_set" class="value"></span><span class="dash-reading-unit">°C</span></div>
              </div>
            </div>
            <div class="dash-history-plot"><div class="dash-chart"></div></div>
            <div class="dash-chart-status"></div>
          </article>

          <article data-chart="p01_hc2_flow_set,p01_hc2_flow_act" data-chart-bit="4" data-chart-state="burner" class="dash dash-history OPT_HC2">
            <div class="dash-header" data-i18n="hc2$-$flow"></div>
            <div class="dash-readings">
              <div class="dash-reading dash-reading-primary dash-series-second">
                <div class="dash-reading-label" data-i18n="chart_actual"></div>
                <div class="dash-reading-value"><span id="p01_hc2_flow_act" class="value"></span><span class="dash-reading-unit">°C</span></div>
              </div>
              <div class="dash-reading dash-reading-secondary dash-series-first">
                <div class="dash-reading-label" data-i18n="chart_target"></div>
                <div class="dash-reading-value"><span id="p01_hc2_flow_set" class="value"></span><span class="dash-reading-unit">°C</span></div>
              </div>
            </div>
            <div class="dash-history-plot"><div class="dash-chart"></div></div>
            <div class="dash-chart-status"></div>
          </article>

          <article data-chart="p01_temp_out_act,p01_temp_out_dmp" data-chart-primary="0" data-chart-bit="5" class="dash dash-history">
            <div class="dash-header" data-i18n="temp_out"></div>
            <div class="dash-readings">
              <div class="dash-reading dash-reading-primary dash-series-first">
                <div class="dash-reading-label" data-i18n="chart_current"></div>
                <div class="dash-reading-value"><span id="p01_temp_out_act" class="value"></span><span class="dash-reading-unit">°C</span></div>
              </div>
              <div class="dash-reading dash-reading-secondary dash-series-second">
                <div class="dash-reading-label" data-i18n="chart_damped"></div>
                <div class="dash-reading-value"><span id="p01_temp_out_dmp" class="value"></span><span class="dash-reading-unit">°C</span></div>
              </div>
            </div>
            <div class="dash-history-plot"><div class="dash-chart"></div></div>
            <div class="dash-chart-status"></div>
          </article>




        </div>
        <!-- END Grid2 -->
      </div>
      <!-- END Tab-Content -->
      <!--SECTION-END-->
    </main>
    <!-- Footer -->
    <footer
      style="
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
      ">
      <div id="status">STATUS</div>
    </footer>
  </body>
</html>
