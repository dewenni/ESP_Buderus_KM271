<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>ESP-Buderus-KM271</title>
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="stylesheet" type="text/css" href="lib.css" />
    <link rel="stylesheet" type="text/css" href="user.css" />
    <script defer src="lib.js" defer></script>
    <script defer src="user.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <header class="app-header">
      <strong class="app-brand">ESP-Buderus-KM271</strong>
      <div class="app-modes">
        <span class="simModeBar">SIMULATION</span>
        <span class="setupModeBar">SETUP-MODE</span>
      </div>
      <div class="app-connection-actions">
      <span id="p00_web_connection" class="app-connection" role="status" aria-live="polite">
        <span id="p00_web_connection_text" data-i18n="ui_disconnected"></span>
      </span>
        <button id="p99_reloadButton" type="button" class="app-reload svg i_auto" data-ui-local aria-label="Reload" hidden></button>
      </div>
    </header>
    <!-- Dialog Version -->
    <dialog id="version_dialog">
      <article class="dash">
        <div class="dash-main">
          <div class="dash-header" data-i18n="version_info"></div>
          <br />
          <div class="leftright">
            <span data-i18n="act_version"></span>
            <span id="p00_dialog_version"></span>
          </div>
          <div class="leftright">
            <span data-i18n="github_version"></span>
            <a id="p00_dialog_git_version" aria-busy="true"></a>
          </div>
          <br />
          <div
            id="p00_update_btn_hide"
            class="dash-footer"
            style="display: none">
            <button
              id="p00_update_btn"
              style="width: 75%"
              aria-busy="false"></button>
          </div>
          <div class="dash-footer">
            <button
              id="close_version_Dialog_btn"
              data-i18n="close"
              style="width: 75%"></button>
          </div>
        </div>
        <div class="dash-icon">
          <div class="svg i_github"></div>
        </div>
      </article>
    </dialog>
    <!-- Dialog OTA-FAILED -->
    <dialog id="ota_update_failed_dialog">
      <article class="dash">
        <div class="dash-main">
          <div class="dash-header" data-i18n="update_failed"></div>
          <div style="text-align: center">
            <span data-i18n="error_text"></span>
            <span id="p00_ota_upd_err"></span>
          </div>
          <div class="dash-content">
            <p data-i18n="update_error_info"></p>
          </div>
          <div class="dash-footer">
            <button
              id="p00_ota_failed_btn"
              data-i18n="ok"
              style="width: 75%"></button>
          </div>
        </div>
        <div class="dash-icon">
          <div class="svg i_alarm"></div>
        </div>
      </article>
    </dialog>
    <!-- Dialog OTA-Done -->
    <dialog id="ota_update_done_dialog">
      <article class="dash">
        <div class="dash-main">
          <div class="dash-header" data-i18n="update_done"></div>
          <div class="dash-content">
            <p data-i18n="update_info"></p>
          </div>
          <div class="dash-footer">
            <button
              id="p00_ota_confirm_btn"
              data-i18n="restart"
              style="width: 75%"></button>
          </div>
        </div>
        <div class="dash-icon">
          <div class="svg i_update_done"></div>
        </div>
      </article>
    </dialog>
