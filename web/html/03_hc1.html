<!DOCTYPE html>
<html>
  <title>ESP Async Web Server</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" type="text/css" href="../css/pico.css" />
  <link rel="stylesheet" type="text/css" href="../css/custom.css" />
  <link rel="stylesheet" type="text/css" href="../css/icons.css" />
  <script src="../js/doc.js" defer></script>
  <script src="../js/lang.js" defer></script>
  <script src="../js/fun.js" defer></script>
  <script src="../js/events.js" defer></script>
  <style></style>
  <script>
    function test() {
      document.getElementById("tab3").classList.add("active");
      localizePage("de");
    }
    setInterval(test, 1000);
  </script>
  <body>
    <!-- Layout -->
    <header
      style="
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
      "></header>
    <!-- Tab-Content -->
    <main class="container">
      <!--SECTION-START-->
      <!-- HC1-Inhalt hier -->
      <div id="tab3" class="tab-content heating-circuit information-page">
        <header class="page-heading">
          <h1 data-i18n="heating_circuit_1"></h1><p data-i18n="info_circuit_subtitle"></p>
        </header>
        <div class="heating-circuit-info">
<article class="card">
            <h2 class="table-header" data-i18n="config"></h2>
            <table class="striped">
              <tbody>
                <tr>
                  <td data-i18n="night_temp"></td>
                  <td id="p03_hc1_night_temp" class="table-value"></td>
                </tr>
                <tr>
                  <td data-i18n="day_temp"></td>
                  <td id="p03_hc1_day_temp" class="table-value"></td>
                </tr>
                <tr>
                  <td data-i18n="operation_mode"></td>
                  <td id="p03_hc1_op_mode" class="table-value"></td>
                </tr>
                <tr>
                  <td data-i18n="holiday_temp"></td>
                  <td id="p03_hc1_hday_temp" class="table-value"></td>
                </tr>
                <tr>
                  <td data-i18n="max_temp"></td>
                  <td id="p03_hc1_max_temp" class="table-value"></td>
                </tr>
                <tr>
                  <td data-i18n="control_design_temp"></td>
                  <td id="p03_hc1_interp" class="table-value"></td>
                </tr>
                <tr>
                  <td data-i18n="switch_on_temperature"></td>
                  <td id="p03_hc1_sw_on_temp" class="table-value">--</td>
                </tr>
                <tr>
                  <td data-i18n="switch_off_threshold"></td>
                  <td id="p03_hc1_sw_off_th" class="table-value">--</td>
                </tr>
                <tr>
                  <td data-i18n="reduction_mode"></td>
                  <td id="p03_hc1_red_mode" class="table-value"></td>
                </tr>
                <tr>
                  <td data-i18n="heating_system"></td>
                  <td id="p03_hc1_heatsys" class="table-value"></td>
                </tr>
                <tr>
                  <td data-i18n="temp_offset"></td>
                  <td id="p03_hc1_temp_offset" class="table-value"></td>
                </tr>
                <tr>
                  <td data-i18n="remotecontrol"></td>
                  <td id="p03_hc1_remotecontrol" class="table-value"></td>
                </tr>
                <tr>
                  <td data-i18n="control_summer_threshold"></td>
                  <td id="p03_hc1_summer_th" class="table-value">--</td>
                </tr>
                <tr>
                  <td data-i18n="control_frost_threshold"></td>
                  <td id="p03_hc1_frost_th" class="table-value">--</td>
                </tr>
              </tbody>
            </table>
          </article>
<article class="card">
            <h2 class="table-header" data-i18n="info_current_values"></h2>
            <table class="striped">
              <tbody>
                <tr><td data-i18n="flow_setpoint"></td><td class="table-value"><span id="p03_hc1_flow_set"></span><span class="information-unit">°C</span></td></tr>
                <tr><td data-i18n="flow_temp"></td><td class="table-value"><span id="p03_hc1_flow_act"></span><span class="information-unit">°C</span></td></tr>
                <tr><td data-i18n="heat_curve_10C"></td><td class="table-value"><span id="p03_hc1_heat_curve_10C"></span><span class="information-unit">°C</span></td></tr>
                <tr><td data-i18n="heat_curve_0C"></td><td class="table-value"><span id="p03_hc1_heat_curve_0C"></span><span class="information-unit">°C</span></td></tr>
                <tr><td data-i18n="heat_curve_-10C"></td><td class="table-value"><span id="p03_hc1_heat_curve_-10C"></span><span class="information-unit">°C</span></td></tr>
                <tr><td data-i18n="mixer"></td><td class="table-value"><span id="p03_hc1_mixer"></span><span class="information-unit">%</span></td></tr>
                <tr><td data-i18n="off_time_opt_duration"></td><td class="table-value"><span id="p03_hc1_off_time_opt_dur">--</span><span class="information-unit">min</span></td></tr>
                <tr><td data-i18n="on_time_opt_duration"></td><td class="table-value"><span id="p03_hc1_on_time_opt_dur">--</span><span class="information-unit">min</span></td></tr>
                <tr><td data-i18n="pump"></td><td class="table-value"><span id="p03_hc1_pump" data-info-state="number"></span><span class="information-unit">%</span></td></tr>
                <tr><td data-i18n="room_setpoint"></td><td class="table-value"><span id="p03_hc1_room_set"></span><span class="information-unit">°C</span></td></tr>
                <tr><td data-i18n="room_temp"></td><td class="table-value"><span id="p03_hc1_room_temp"></span><span class="information-unit">°C</span></td></tr>
              </tbody>
            </table>
          </article>
<article class="card">
<h2 class="table-header" data-i18n="info_operating_states"></h2>
<table class="striped">
<tbody>
<tr>
                  <td data-i18n="ov1_off_time_optimization"></td>
                  <td id="p03_hc1_ov1_off_time_opt" class="table-value" data-info-state="on">--</td>
                </tr>
<tr>
                  <td data-i18n="ov1_on_time_optimization"></td>
                  <td id="p03_hc1_ov1_on_time_opt" class="table-value" data-info-state="on">--</td>
                </tr>
<tr>
                  <td data-i18n="ov1_automatic"></td>
                  <td id="p03_hc1_ov1_auto" class="table-value" data-info-state="on"></td>
                </tr>
<tr>
                  <td data-i18n="ov1_ww_priority"></td>
                  <td id="p03_hc1_ov1_ww_priority" class="table-value" data-info-state="on"></td>
                </tr>
<tr>
                  <td data-i18n="ov1_screed_drying"></td>
                  <td id="p03_hc1_ov1_screed_drying" class="table-value" data-info-state="on"></td>
                </tr>
<tr>
                  <td data-i18n="ov1_holiday"></td>
                  <td id="p03_hc1_ov1_holiday" class="table-value" data-info-state="on"></td>
                </tr>
<tr>
                  <td data-i18n="ov1_frost_protection"></td>
                  <td id="p03_hc1_ov1_frost" class="table-value" data-info-state="on">--</td>
                </tr>
<tr>
                  <td data-i18n="ov2_summer"></td>
                  <td id="p03_hc1_ov2_summer" class="table-value" data-info-state="on"></td>
                </tr>
<tr>
                  <td data-i18n="ov2_day"></td>
                  <td id="p03_hc1_ov2_day" class="table-value" data-info-state="on"></td>
                </tr>
</tbody>
</table>
</article>
<article class="card">
<h2 class="table-header" data-i18n="info_monitoring"></h2>
<table class="striped">
<tbody>
<tr>
                  <td data-i18n="ov2_no_conn_to_remotectrl"></td>
                  <td id="p03_hc1_ov2_no_con_remote" class="table-value" data-info-state="error">--</td>
                </tr>
<tr>
                  <td data-i18n="ov2_remotectrl_error"></td>
                  <td id="p03_hc1_ov2_remote_err" class="table-value" data-info-state="error">--</td>
                </tr>
<tr>
                  <td data-i18n="ov2_failure_flow_sensor"></td>
                  <td id="p03_hc1_ov2_fail_flow_sens" class="table-value" data-info-state="error">
                    --
                  </td>
                </tr>
<tr>
                  <td data-i18n="ov2_flow_at_maximum"></td>
                  <td id="p03_hc1_ov2_flow_at_max" class="table-value" data-info-state="error">--</td>
                </tr>
<tr>
                  <td data-i18n="ov2_external_signal_input"></td>
                  <td id="p03_hc1_ov2_ext_sign_in" class="table-value" data-info-state="error">--</td>
                </tr>
</tbody>
</table>
</article>
        </div>

        <article class="card">
          <div class="program-heading">
            <h2 class="table-header" data-i18n="programs"></h2>
            <div class="program-status"><span data-i18n="act_prg"></span><strong id="p03_hc1_act_prg" class="program-status-value" role="status"></strong></div>
          </div>
          <div class="weekly-program" data-timer-prefix="p03_hc1">
            <p>
<small data-i18n="weekly_program_hint"></small></p>
            <p class="weekly-program-status" role="status"></p>
            <div class="weekly-program-scroll" hidden>
              <div class="weekly-program-chart">
</div>
            </div>
            <p class="weekly-program-legend" hidden>
              <span><i class="weekly-program-key-on" aria-hidden="true"></i> <span data-i18n="weekly_program_on"></span></span>
              <span><i class="weekly-program-key-off" aria-hidden="true"></i> <span data-i18n="weekly_program_off"></span></span>
            </p>
            <details>
              <summary data-i18n="weekly_program_details"></summary>
          <table class="striped">
            <tbody>
              <tr>
                <td data-i18n="timer++ 01"></td>
                <td id="p03_hc1_t01" class="table-value"></td>
              </tr>
              <tr>
                <td data-i18n="timer++ 02"></td>
                <td id="p03_hc1_t02" class="table-value"></td>
              </tr>
              <tr>
                <td data-i18n="timer++ 03"></td>
                <td id="p03_hc1_t03" class="table-value"></td>
              </tr>
              <tr>
                <td data-i18n="timer++ 04"></td>
                <td id="p03_hc1_t04" class="table-value"></td>
              </tr>
              <tr>
                <td data-i18n="timer++ 05"></td>
                <td id="p03_hc1_t05" class="table-value"></td>
              </tr>
              <tr>
                <td data-i18n="timer++ 06"></td>
                <td id="p03_hc1_t06" class="table-value"></td>
              </tr>
              <tr>
                <td data-i18n="timer++ 07"></td>
                <td id="p03_hc1_t07" class="table-value"></td>
              </tr>
              <tr>
                <td data-i18n="timer++ 08"></td>
                <td id="p03_hc1_t08" class="table-value"></td>
              </tr>
              <tr>
                <td data-i18n="timer++ 09"></td>
                <td id="p03_hc1_t09" class="table-value"></td>
              </tr>
              <tr>
                <td data-i18n="timer++ 10"></td>
                <td id="p03_hc1_t10" class="table-value"></td>
              </tr>
              <tr>
                <td data-i18n="timer++ 11"></td>
                <td id="p03_hc1_t11" class="table-value"></td>
              </tr>
              <tr>
                <td data-i18n="timer++ 12"></td>
                <td id="p03_hc1_t12" class="table-value"></td>
              </tr>
              <tr>
                <td data-i18n="timer++ 13"></td>
                <td id="p03_hc1_t13" class="table-value"></td>
              </tr>
              <tr>
                <td data-i18n="timer++ 14"></td>
                <td id="p03_hc1_t14" class="table-value"></td>
              </tr>
            </tbody>
          </table>
            </details>
          </div>
        </article>
      </div>
      <!--SECTION-END-->
    </main>
    <!-- Footer -->
    <footer
      style="
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
      ">
      <div id="status">STATUS</div>
    </footer>
  </body>
</html>
