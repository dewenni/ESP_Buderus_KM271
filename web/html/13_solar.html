<!DOCTYPE html>
<html>
  <head>
    <title>ESP Async Web Server</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="../css/pico.css" />
    <link rel="stylesheet" type="text/css" href="../css/custom.css" />
    <link rel="stylesheet" type="text/css" href="../css/icons.css" />
    <script src="../js/main.js" defer></script>
    <script src="../js/lang.js" defer></script>
    <style></style>
    <script>
      function test() {
        document.getElementById("tab13").classList.add("active");
      }
      setInterval(test, 1000);
    </script>
  </head>
  <body>
    <!-- Layout -->
    <header
      style="
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
      "></header>
    <!-- Tab-Content -->
    <main class="container">
      <!--SECTION-START-->
      <div id="tab13" class="tab-content information-page information-page--compact">
        <header class="page-heading">
          <h1 data-i18n="solar"></h1><p data-i18n="info_solar_subtitle"></p>
        </header>
<div class="information-grid">
<article class="card">
            <h2 class="table-header" data-i18n="config"></h2>
            <table class="striped">
              <tbody>
                <tr>
                  <td data-i18n="on"></td>
                  <td id="p13_solar_enable" class="table-value">--</td>
                </tr>
                <tr>
                  <td data-i18n="opmode"></td>
                  <td id="p13_solar_opmode" class="table-value">--</td>
                </tr>
                <tr>
                  <td data-i18n="solar_min"></td>
                  <td id="p13_solar_min" class="table-value">--</td>
                </tr>
                <tr>
                  <td data-i18n="solar_max"></td>
                  <td id="p13_solar_max" class="table-value">--</td>
                </tr>
              </tbody>
            </table>
          </article>
<article class="card">
            <h2 class="table-header" data-i18n="info_current_values"></h2>
            <table class="striped">
              <tbody>
                <tr><td data-i18n="load"></td><td class="table-value"><span id="p13_solar_load" data-info-state="on">--</span></td></tr>
                <tr><td data-i18n="hot_water"></td><td class="table-value"><span id="p13_solar_ww">--</span><span class="information-unit">°C</span></td></tr>
                <tr><td data-i18n="collector"></td><td class="table-value"><span id="p13_solar_collector">--</span><span class="information-unit">°C</span></td></tr>
                <tr><td data-i18n="info_solar_status"></td><td class="table-value"><span id="p13_solar_9147">--</span></td></tr>
              </tbody>
            </table>
          </article>
<article class="card">
<h2 class="table-header" data-i18n="lifetimes"></h2>
<div class="information-runtime">
<span>
<span id="p13_solar_run_years">--</span> <small data-i18n="info_years"></small></span>
<span>
<span id="p13_solar_run_days">--</span> <small data-i18n="info_days"></small></span>
<span>
<span id="p13_solar_run_hours">--</span> <small data-i18n="info_hours"></small></span>
<span>
<span id="p13_solar_run_min">--</span> <small data-i18n="info_minutes"></small></span>
</div>
</article>
</div>
</div>
      <!--SECTION-END-->
    </main>
    <!-- Footer -->
    <footer
      style="
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
      ">
      <div id="status">STATUS</div>
    </footer>
  </body>
</html>
