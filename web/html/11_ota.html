<!DOCTYPE html>
<html>
  <head>
    <title>ESP Async Web Server</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="../css/pico.css" />
    <link rel="stylesheet" type="text/css" href="../css/custom.css" />
    <link rel="stylesheet" type="text/css" href="../css/icons.css" />
    <script src="../js/doc.js" defer></script>
    <script src="../js/lang.js" defer></script>
    <script src="../js/fun.js" defer></script>
    <script src="../js/events.js" defer></script>
    <style></style>
    <script>
      function test() {
        document.getElementById("tab11").classList.add("active");
        localizePage("de");
      }
      setInterval(test, 1000);
    </script>
  </head>
  <body>
    <!-- Layout -->
    <header
      style="
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
      "></header>
    <!-- Tab-Content -->
    <main class="container">
      <!--SECTION-START-->
      <div id="tab11" class="tab-content information-page">
        <header class="page-heading">
          <h1 data-i18n="tools"></h1><p data-i18n="info_tools_subtitle"></p>
        </header>
        <div class="information-grid tools-grid">
          <article class="card tools tools-firmware" data-connection-required>
            <h2 class="table-header" data-i18n="info_firmware_update"></h2>
            <div class="tools-update-methods">
              <section class="tools-update-method">
                <h3 class="tools-method-title"><svg class="tools-upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M4 15v5h16v-5" /></svg><span data-i18n="info_update_local"></span></h3>
                <p class="tools-method-description" data-i18n="info_update_local_hint"></p>
            <form method="POST" action="#" enctype="multipart/form-data" id="ota_upload_form">
              <label class="tools-file-label" for="ota_file_input" data-i18n="info_firmware_file"></label>
              <div class="tools-source-box"><input type="file" name="ota_update" id="ota_file_input" onchange="ota_sub_fun(this)" accept=".bin" /></div>
              <p class="information-note" hidden data-selected-file="ota_file_input" data-i18n="info_no_file"></p>
              <div class="tools-actions">
                <input type="submit" id="ota_update_btn" disabled="disabled" value="Datei installieren" data-i18n="info_install_file" />
              </div>
              <div id="ota_status_txt" class="information-note" style="display:none" data-i18n="update_ready"></div>
              <progress id="ota_progress_bar" style="display:none" max="100" value="0"></progress>
            </form>
              </section>
              <section class="tools-update-method">
                <h3 class="tools-method-title"><i class="svg i_github" aria-hidden="true"></i><span data-i18n="info_update_github"></span></h3>
                <p class="tools-method-description" data-i18n="info_update_github_hint"></p>
                <div class="tools-source-box tools-version-info" id="github-update-info">
                  <div><span data-i18n="info_git_installed"></span> <strong id="p00_dialog_version"></strong></div>
                  <div><span data-i18n="info_git_release"></span> <a id="p00_dialog_git_version" target="_blank" rel="noopener noreferrer">—</a></div>
                  <span id="p11_git_feedback" role="status" aria-live="polite"></span>
                </div>
                <span id="p11_git_state" hidden>idle</span>
                <span id="p11_git_progress" hidden>0</span>
                <div class="tools-actions">
                  <button type="button" id="p11_check_git_btn" data-ui-local data-i18n="info_check_github"></button>
                  <span id="p00_update_btn_hide" style="display: none"><button type="button" id="p00_update_btn" data-ui-local></button></span>
                </div>
                <progress id="github_progress_bar" max="100" value="0" hidden></progress>
              </section>
            </div>
          </article>
          <article class="card tools" data-connection-required>
            <h2 class="table-header" data-i18n="info_configuration"></h2>
            <form method="POST" action="#" enctype="multipart/form-data" id="file_upload_form">
              <label class="tools-file-label" for="file_input" data-i18n="info_config_file"></label>
              <input type="file" name="file_update" id="file_input" accept=".json" onchange="file_sub_fun(this)" />
              <p class="information-note" hidden data-selected-file="file_input" data-i18n="info_no_file"></p>
              <div class="tools-actions">
                <button type="submit" id="file_upload_btn" data-i18n="info_import" disabled></button>
                <button type="button" id="p11_export_btn" data-i18n="info_export" onclick="exportConfig()"></button>
                <button type="button" id="p11_file_show_btn" data-i18n="info_show"></button>
              </div>
              <div id="upload_status_txt" class="information-note" style="display:none" data-i18n="import_ready"></div>
            </form>
          </article>
        </div>
        <dialog id="open_config_dialog">
            <article>
              <header><strong>config.json</strong></header>
              <pre id="config_output"></pre>
              <div class="dash-footer">
                <button
                  id="p11_config_dialog_btn"
                  data-i18n="close"
                  style="width: 75%"></button>
              </div>
            </article>
          </dialog>
      </div>
      <!--SECTION-END-->
    </main>
    <!-- Footer -->
    <footer>
      <div id="connectionLostBar" style="display: none">
        <div data-i18n="lost_connection"></div>
        <button
          id="p99_reloadButton"
          class="svg i_reload"
          style="width: 100px"></button>
      </div>
    </footer>
  </body>
</html>
